<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1E3C72">
<title>FacilCount — Téléchargement</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff; border-radius: 24px; padding: 36px 28px;
    max-width: 420px; width: 100%; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  .card img.brand { width: 190px; max-width: 75%; margin-bottom: 4px; }
  .subtitle { color: #888; margin-bottom: 20px; font-size: 14px; }
  #qrcode { display: flex; justify-content: center; margin: 16px auto; }
  #qrcode img, #qrcode canvas { border-radius: 12px; }
  .btn {
    display: block; background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: #fff; text-decoration: none; padding: 14px; border-radius: 12px;
    font-weight: bold; margin: 10px 0; font-size: 16px;
  }
  .btn.secondary { background: #f0f0f0; color: #333; }
  .btn.ios { background: #000; }
  .hint { color: #aaa; font-size: 13px; margin-top: 14px; }
  .warn { background: #fff8e1; color: #7a5c00; padding: 10px; border-radius: 8px; font-size: 13px; margin-top: 12px; }
  .steps { text-align: left; background: #f8f9fb; border-radius: 12px; padding: 16px; margin-top: 14px; }
  .steps h3 { font-size: 15px; margin-bottom: 10px; color: #1e3c72; }
  .steps ol { padding-left: 20px; }
  .steps li { font-size: 14px; margin-bottom: 8px; color: #444; }
</style>
</head>
<body>
  <div class="card">
    <img class="brand" src="logo_facilcount_vertical.png" alt="FacilCount">
    <p class="subtitle">Gérez votre commerce facilement</p>

    <div id="qrcode"></div>
    <p class="hint">📱 Scannez ce QR code avec l'appareil photo de votre téléphone</p>

    <div id="actions"></div>

    <div class="warn" id="androidWarn" style="display:none">
      ⚠️ <strong>Android :</strong> si le téléchargement est bloqué, autorisez
      « Sources inconnues » dans Paramètres → Sécurité.
    </div>
  </div>

<script>
  var APK_ARM64 = 'https://github.com/bongaihenri-wq/facil_count_nouveau/releases/download/v1.0.1/facilcount-v1.0.1-android-arm64.apk';
  var APK_V7A   = 'https://github.com/bongaihenri-wq/facil_count_nouveau/releases/download/v1.0.1/facilcount-v1.0.1-android-armv7.apk';
  var PWA_URL   = 'https://bongaihenri-wq.github.io/facilcount-web/';

  var ua = navigator.userAgent;
  var isAndroid = /android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua);

  new QRCode(document.getElementById('qrcode'), {
    text: window.location.href,
    width: 200, height: 200,
    colorDark: '#1e3c72', colorLight: '#ffffff'
  });

  var actions = document.getElementById('actions');

  if (isAndroid) {
    document.getElementById('androidWarn').style.display = 'block';
    actions.innerHTML =
      '<a class="btn" href="' + APK_ARM64 + '">⬇️ Télécharger FacilCount v1.0.1 (Android)</a>' +
      '<a class="btn secondary" href="' + APK_V7A + '">Ancien téléphone Android (ARMv7)</a>';
  } else if (isIOS) {
    actions.innerHTML =
      '<a class="btn ios" href="' + PWA_URL + '">🍎 Ouvrir FacilCount pour iPhone</a>' +
      '<div class="steps"><h3>📲 Installer sur votre iPhone</h3><ol>' +
      '<li>Cliquez sur le bouton <strong>noir</strong> pour ouvrir l\'app dans <strong>Safari</strong></li>' +
      '<li>Touchez l\'icône <strong>Partager</strong> ⎋</li>' +
      '<li>Défilez → <strong>« Sur l\'écran d\'accueil »</strong> ➕</li>' +
      '<li>Confirmez avec <strong>« Ajouter »</strong></li>' +
      '<li>✅ L\'icône FacilCount est sur votre écran d\'accueil</li>' +
      '</ol><p style="font-size:12px;color:#999;margin-top:10px">⚠️ Nécessite internet.</p></div>';
  } else {
    actions.innerHTML =
      '<p class="hint">Le QR code détecte automatiquement Android / iOS</p>' +
      '<a class="btn" href="' + APK_ARM64 + '">⬇️ Télécharger l\'APK (Android)</a>';
  }
</script>
</body>
</html>
