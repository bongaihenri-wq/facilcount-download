<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FacilCount — Téléchargement</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff; border-radius: 24px; padding: 40px 30px;
    max-width: 420px; width: 100%; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  .logo { font-size: 40px; margin-bottom: 8px; }
  h1 { color: #1e3c72; font-size: 28px; margin-bottom: 4px; }
  .subtitle { color: #888; margin-bottom: 24px; }
  #qrcode { display: flex; justify-content: center; margin: 20px auto; }
  #qrcode img, #qrcode canvas { border-radius: 12px; }
  .btn {
    display: block; background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: #fff; text-decoration: none; padding: 14px; border-radius: 12px;
    font-weight: bold; margin: 10px 0; font-size: 16px;
  }
  .btn.secondary { background: #f0f0f0; color: #333; }
  .btn.ios { background: #000; }
  .hint { color: #aaa; font-size: 13px; margin-top: 16px; }
  .warn { background: #fff8e1; color: #7a5c00; padding: 10px; border-radius: 8px; font-size: 13px; margin-top: 12px; }
  .steps { text-align: left; background: #f8f9fb; border-radius: 12px; padding: 16px; margin-top: 14px; }
  .steps h3 { font-size: 15px; margin-bottom: 10px; color: #1e3c72; }
  .steps ol { padding-left: 20px; }
  .steps li { font-size: 14px; margin-bottom: 8px; color: #444; }
  .steps .icon { font-size: 16px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🏪</div>
    <h1>FacilCount</h1>
    <p class="subtitle">Gérez votre commerce facilement</p>

    <div id="qrcode"></div>
    <p class="hint">📱 Scannez ce QR code avec votre téléphone</p>

    <div id="actions"></div>

    <div class="warn" id="androidWarn" style="display:none">
      ⚠️ <strong>Android :</strong> si le téléchargement est bloqué, autorisez
      « Sources inconnues » dans Paramètres → Sécurité.
    </div>
  </div>

<script>
  // ✅ LIENS
  const APK_ARM64 = 'https://github.com/bongaihenri-wq/facil_count_nouveau/releases/download/v1.0.0/facilcount-v1.0.0-android-arm64.apk';
  const APK_V7A   = 'https://github.com/bongaihenri-wq/facil_count_nouveau/releases/download/v1.0.0/facilcount-v1.0.0-android-armv7.apk';
  // 🆕 URL de l'app web (PWA iOS) — À REMPLIR après déploiement de l'étape 2
  const PWA_URL   = 'https://bongaihenri-wq.github.io/facilcount-web/';

  const ua = navigator.userAgent;
  const isAndroid = /android/i.test(ua);
  const isIOS = /iPhone|iPad|iPod/i.test(ua);

  new QRCode(document.getElementById('qrcode'), {
    text: window.location.href, width: 200, height: 200,
    colorDark: '#1e3c72', colorLight: '#ffffff',
  });

  const actions = document.getElementById('actions');

  if (isAndroid) {
    document.getElementById('androidWarn').style.display = 'block';
    actions.innerHTML = `
      <a class="btn" href="${APK_ARM64}">⬇️ Télécharger FacilCount (Android)</a>
      <a class="btn secondary" href="${APK_V7A}">Ancien téléphone Android (ARMv7)</a>`;
  } else if (isIOS) {
    // 🆕 iOS : PWA "Sur l'écran d'accueil" + étapes détaillées
    actions.innerHTML = `
      <a class="btn ios" href="${PWA_URL}">🍎 Ouvrir FacilCount pour iPhone</a>
      <div class="steps">
        <h3>📲 Comment installer sur votre iPhone</h3>
        <ol>
          <li>Cliquez sur le bouton <strong>noir ci-dessus</strong> pour ouvrir l'app dans <strong>Safari</strong></li>
          <li>En bas de Safari, touchez l'icône <span class="icon">⎋</span> <strong>Partager</strong> (carré avec flèche)</li>
          <li>Faites défiler et touchez <strong>« Sur l'écran d'accueil »</strong> <span class="icon">➕</span></li>
          <li>Confirmez avec <strong>« Ajouter »</strong> en haut à droite</li>
          <li>✅ L'icône <strong>FacilCount</strong> apparaît sur votre écran d'accueil — touchez-la pour ouvrir l'app à chaque fois</li>
        </ol>
        <p style="font-size:12px;color:#999;margin-top:10px">
          ⚠️ Nécessite une connexion internet. L'icône fonctionne comme une application.
        </p>
      </div>`;
  } else {
    actions.innerHTML = `
      <p class="hint">Le QR code détecte automatiquement Android / iOS</p>
      <a class="btn" href="${APK_ARM64}">⬇️ Télécharger l'APK (Android)</a>`;
  }
</script>
</body>
</html>
